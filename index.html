  else try{const x=await jsonp({action:'aparMaster'});if(!x.ok)throw new Error(x.error||'Gagal memuat data');AM=x.rows;cput({action:'aparMaster'},APAR_SCRIPT_URL,x)}
  catch(e){view.innerHTML=`<div class="card empty" style="color:var(--r)">${esc(e.message)}</div>`;return}
  const hits=AM.filter(r=>r.kode===kode&&(!plant||r.plant===plant));
  if(!hits.length){view.innerHTML=`<div class="card empty" style="color:var(--r)">Kode alat <b>${esc(kode)}</b>${plant?' di <b>'+esc(plant)+'</b>':''} tidak ditemukan di master data.</div>`;return}

function renderPetugas(){

  <div class="card">${AITEMS.map(([k,n])=>`<div class="itm" data-k="${k}"><div class="nm">${n}</div><div class="ck3">${btn(k,'OK','✓')}${btn(k,'NG','—')}${btn(k,'NA','○ Abaikan')}</div></div>`).join('')}
  ${a.jenis==='CO2'?`<div class="itm"><div class="nm">Berat (kg) <span class="l">khusus CO2</span></div><input type="number" step="any" min="0" inputmode="decimal" value="${esc(PS.berat)}" oninput="PS.berat=this.value"></div>`:''}
  <div class="itm"><div class="nm">Tanggal Expired <span class="l">ubah jika APAR sudah diisi ulang / diganti</span></div><input type="date" value="${esc(PS.exp)}" onchange="PS.exp=this.value"></div>

  <div id="pserr" style="color:var(--r);margin:10px 0;font-weight:600"></div><button class="p" id="psbtn" style="width:100%;padding:14px;font-size:16px" onclick="psSubmit()">Kirim Checksheet</button></div>
  <div class="l" style="margin-top:10px;text-align:center">✓ hijau = baik · — merah = tidak baik · ○ abu-abu = diabaikan</div>`;
}
function psSet(k,v){PS.items[k]=v;document.querySelectorAll('.itm[data-k="'+k+'"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
async function psSubmit(){
  const a=PS.a,e=m=>{document.getElementById('pserr').textContent=m};e('');
  const miss=AITEMS.filter(([k])=>!PS.items[k]);
  if(miss.length)return e('Pilih ✓, — atau ○ untuk semua item. Belum dipilih: '+miss.map(x=>x[1]).join(', ')+'.');
  if(a.jenis==='CO2'&&!(parseFloat(PS.berat)>0))return e('Berat (kg) wajib diisi untuk APAR CO2.');
  if(!PS.exp)return e('Tanggal expired wajib diisi.');
  if(!PS.tgl)return e('Tanggal pemeriksaan wajib diisi.');
  if(!PS.petugas.trim())return e('Nama petugas wajib diisi.');
  const b=document.getElementById('psbtn');b.disabled=true;b.textContent='Mengirim…';
  try{
    const f=await fbaReady();
    const j=await f.submit({kode:a.kode,plant:a.plant,exp:PS.exp,tanggal:PS.tgl,petugas:PS.petugas.trim(),items:PS.items,berat:PS.berat,catatan:PS.catatan});
    try{localStorage.setItem('mi_petugas',PS.petugas.trim())}catch(x){}
    const [yy,mm]=j.bulan.split('-');
    view.innerHTML=`<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:54px;color:#16a34a">✓</div><div style="font-size:19px;font-weight:700;margin:6px 0">Checksheet tersimpan</div><div>${esc(a.kode)} · ${esc(a.plant)}</div><div class="l" style="margin:6px 0 16px">Bulan ${BLNF[+mm-1]} ${yy}${j.updated?' (menggantikan isian sebelumnya di bulan yang sama)':''}</div>${j.expUpdated?`<div class="l" style="margin:-8px 0 14px">Tanggal expired diperbarui menjadi ${esc(fmtD(PS.exp))}</div>`:''}${j.queued?`<div class="l" style="margin:-8px 0 14px;color:var(--r)">Belum ada sinyal: data tersimpan di HP ini dan akan terkirim otomatis saat HP kembali online (buka halaman ini lagi).</div>`:''}<button class="p" onclick="location.reload()">Isi lagi</button></div>`;
  }catch(x){b.disabled=false;b.textContent='Kirim Checksheet';e('Gagal mengirim: '+x.message+(x instanceof TypeError?' (periksa koneksi internet)':''))}
}

   `<div class="l" style="margin:4px 0 10px">${esc(r.plant)} · ${esc(r.lokasi)}</div>`
   +HITEMS.map(([k,n])=>{const v=MARK[r.items[k]]||['?','na','-'];return `<div class="itm" style="display:flex;justify-content:space-between;align-items:center"><span>${n}</span><span class="mk ${v[1]}">${v[0]} <span class="l">${v[2]}</span></span></div>`}).join('')
   +`<div class="itm" style="display:flex;justify-content:space-between"><span>Tanggal</span><b>${esc(r.tgl)}</b></div><div class="itm" style="display:flex;justify-content:space-between"><span>Petugas</span><b>${esc(r.petugas)}</b></div><div class="itm"><div class="l">Catatan</div>${esc(r.catatan)||'-'}</div>`);
}

// ---------- Form petugas (dibuka dari QR: ?hyd=HYDRANT001&plant=...) ----------
async function startHydPetugas(kode,plant){
  document.body.classList.add('pet');document.title='Checksheet '+kode;
  view.innerHTML='<div class="card empty">Memuat data hydrant…</div>';
  const pc=cget({action:'hydMaster'},HYDRANT_SCRIPT_URL);
  if(pc&&pc.rows.some(r=>r.kode===kode&&(!plant||r.plant===plant))){YM=pc.rows;swr({action:'hydMaster'},HYDRANT_SCRIPT_URL,'',r=>{YM=r},null,()=>{})}
  else try{const x=await jsonp({action:'hydMaster'},HYDRANT_SCRIPT_URL);if(!x.ok)throw new Error(x.error||'Gagal memuat data');YM=x.rows;cput({action:'hydMaster'},HYDRANT_SCRIPT_URL,x)}
  catch(e){view.innerHTML=`<div class="card empty" style="color:var(--r)">${esc(e.message)}</div>`;return}
  const hits=YM.filter(r=>r.kode===kode&&(!plant||r.plant===plant));
  if(!hits.length){view.innerHTML=`<div class="card empty" style="color:var(--r)">Kode hydrant <b>${esc(kode)}</b>${plant?' di <b>'+esc(plant)+'</b>':''} tidak ditemukan di master data.</div>`;return}
  if(hits.length>1){
    view.innerHTML=`<div class="card"><div style="font-size:18px;font-weight:700;margin-bottom:6px">Pilih Plant</div><div class="l" style="margin-bottom:10px">Kode ${esc(kode)} ada di beberapa plant.</div>${hits.map(h=>`<a class="btnl p" style="display:block;margin:6px 0;padding:12px;font-size:15px" href="?hyd=${encodeURIComponent(kode)}&plant=${encodeURIComponent(h.plant)}">${esc(h.plant)} · ${esc(h.lokasi)}</a>`).join('')}</div>`;return}
  let nm='';try{nm=localStorage.getItem('mi_petugas')||''}catch(e){}
  YS={a:hits[0],items:{},tgl:today,petugas:nm,catatan:''};renderHydPetugas();
}
function renderHydPetugas(){
  const a=YS.a,btn=(k,v,t)=>`<button type="button" data-v="${v}" class="${YS.items[k]===v?'on':''}" onclick="hsSet('${k}','${v}')">${t}</button>`;
  view.innerHTML=`<div class="card" style="margin-bottom:12px"><div style="font-size:19px;font-weight:700">Checksheet Hydrant</div><div class="l">Pemeriksaan bulanan</div>
  <div style="display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin-top:12px"><span class="l">Plant</span><b>${esc(a.plant)}</b><span class="l">Kode Alat</span><b>${esc(a.kode)}</b><span class="l">Lokasi</span><b>${esc(a.lokasi)}</b></div></div>
  <div class="card">${HITEMS.map(([k,n])=>`<div class="itm" data-k="${k}"><div class="nm">${n}</div><div class="ck3">${btn(k,'OK','✓')}${btn(k,'NG','—')}${btn(k,'NA','○ Abaikan')}</div></div>`).join('')}
  <div class="itm"><div class="nm">Tanggal Pemeriksaan</div><input type="date" value="${esc(YS.tgl)}" onchange="YS.tgl=this.value"></div>
  <div class="itm"><div class="nm">Nama Petugas</div><input value="${esc(YS.petugas)}" placeholder="Nama petugas" oninput="YS.petugas=this.value"></div>
  <div class="itm"><div class="nm">Catatan</div><textarea oninput="YS.catatan=this.value">${esc(YS.catatan)}</textarea></div>
  <div id="yserr" style="color:var(--r);margin:10px 0;font-weight:600"></div><button class="p" id="ysbtn" style="width:100%;padding:14px;font-size:16px" onclick="hsSubmit()">Kirim Checksheet</button></div>
  <div class="l" style="margin-top:10px;text-align:center">✓ hijau = baik · — merah = tidak baik · ○ abu-abu = diabaikan</div>`;
}
function hsSet(k,v){YS.items[k]=v;document.querySelectorAll('.itm[data-k="'+k+'"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
async function hsSubmit(){
  const a=YS.a,e=m=>{document.getElementById('yserr').textContent=m};e('');
  const miss=HITEMS.filter(([k])=>!YS.items[k]);
  if(miss.length)return e('Pilih ✓, — atau ○ untuk semua item. Belum dipilih: '+miss.map(x=>x[1]).join(', ')+'.');
  if(!YS.tgl)return e('Tanggal pemeriksaan wajib diisi.');
  if(!YS.petugas.trim())return e('Nama petugas wajib diisi.');
  const b=document.getElementById('ysbtn');b.disabled=true;b.textContent='Mengirim…';
  try{
    const f=await fbhReady();
    const j=await f.submit({kode:a.kode,plant:a.plant,tanggal:YS.tgl,petugas:YS.petugas.trim(),items:YS.items,catatan:YS.catatan});
    try{localStorage.setItem('mi_petugas',YS.petugas.trim())}catch(x){}
    const [yy,mm]=j.bulan.split('-');
    view.innerHTML=`<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:54px;color:#16a34a">✓</div><div style="font-size:19px;font-weight:700;margin:6px 0">Checksheet tersimpan</div><div>${esc(a.kode)} · ${esc(a.plant)}</div><div class="l" style="margin:6px 0 16px">Bulan ${BLNF[+mm-1]} ${yy}${j.updated?' (menggantikan isian sebelumnya di bulan yang sama)':''}</div>${j.queued?`<div class="l" style="margin:-8px 0 14px;color:var(--r)">Belum ada sinyal: data tersimpan di HP ini dan akan terkirim otomatis saat HP kembali online (buka halaman ini lagi).</div>`:''}<button class="p" onclick="location.reload()">Isi lagi</button></div>`;
  }catch(x){b.disabled=false;b.textContent='Kirim Checksheet';e('Gagal mengirim: '+x.message+(x instanceof TypeError?' (periksa koneksi internet)':''))}
}

function showGate(note,isErr){
  let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
  const f=(id,l,t,ph,ac)=>`<label class="lb">${l}</label><input id="${id}" type="${t}" placeholder="${ph}" autocomplete="${ac}">`;
  const body=gMode==='register'?f('g_n','Nama lengkap','text','','name')+f('g_u','Username','text','huruf kecil, angka, . _ -','username')+f('g_e','Email','email','nama@perusahaan.com','email')+`<label class="lb">Departemen</label><select id="g_t"><option value="">— Pilih departemen —</option>${PICS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>`+f('g_p','Password (min. 6 karakter)','password','','new-password')+f('g_p2','Ulangi password','password','','new-password')
    :gMode==='forgot'?f('g_u','Username atau email','text','','username')
    :f('g_u','Username atau email','text','','username')+f('g_p','Password','password','','current-password');
  const sub=gMode==='register'?'':gMode==='forgot'?'Lupa password: link reset dikirim ke email akun':'';
  const btn=gMode==='register'?'Daftar':gMode==='forgot'?'Kirim link reset':'Masuk';
  const links=gMode==='login'?`<a onclick="gSet('forgot')">Lupa password?</a><a onclick="gSet('register')">Daftar akun baru</a>`:gMode==='register'?`<a onclick="gSet('login')">Sudah punya akun? Masuk</a>`:`<a onclick="gSet('login')">← Kembali ke login</a>`;
  g.innerHTML=`<div class="gcard"><div class="glogo"><img src="${LOGO_LIGHT}" alt="Astra Otoparts"></div><h2>Logistics &amp; Procurement<br>Master Data Infra</h2><div class="gsub">${sub}</div>${body}<div id="g_msg" class="gmsg ${isErr?'err':'ok'}">${esc(note||'')}</div><button class="p gbtn" id="g_btn" onclick="gateSubmit()">${btn}</button><div class="glinks">${links}</div></div>`;
  g.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gateSubmit()}};
  const first=g.querySelector('input');if(first&&!note)first.focus();
}
function gSet(m){gMode=m;showGate('')}
const hideGate=()=>{const g=document.getElementById('gate');if(g)g.remove()};
async function gateSubmit(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:''},m=(t,err)=>{const e=document.getElementById('g_msg');e.textContent=t;e.className='gmsg '+(err?'err':'ok')},b=document.getElementById('g_btn');
  b.disabled=true;const t0=b.textContent;b.textContent='Memproses…';m('');
  try{
    if(gMode==='login')await AUTHX.login(v('g_u'),v('g_p'));
    else if(gMode==='register')await AUTHX.register({nama:v('g_n'),username:v('g_u'),email:v('g_e'),tim:v('g_t'),password:v('g_p'),password2:v('g_p2')});
    else{await AUTHX.resetPassword(v('g_u'));m('Jika akun ditemukan, link reset password sudah dikirim ke emailnya. Periksa kotak masuk atau folder spam.',false)}
  }catch(e){m(e.message,true)}
  const bb=document.getElementById('g_btn');if(bb){bb.disabled=false;bb.textContent=t0}
}

let FB=null,fbErr='',fbF='all';
const fbId=(x,t)=>(x.key+'__'+t).replace(/[^\w-]+/g,'_');
async function loadFB(){
  try{await authReady();if(!AUTHX.enabled)return;FB=await AUTHX.fbList();fbErr='';applyFB()}catch(e){fbErr=e.message}
  if(cur==='fb'||cur==='leader')render()}
function applyFB(){
  if(!SH)return;
  const by={};(FB||[]).forEach(f=>{(by[f.key]=by[f.key]||{})[f.tim]=f});
  SH.forEach(x=>{
    if(x._d===undefined){x._d=x.due;x._f=x.fix}
    const m=by[x.key];x.fb=m||null;
    if(m){const L=Object.values(m),ds=L.map(f=>f.due).filter(Boolean).sort();
      if(ds.length)x.due=ds[ds.length-1];
      x.fix=(x.pic.length?x.pic:Object.keys(m)).every(t=>m[t]&&m[t].status==='Selesai')?'Selesai':'Progress'}
    else{x.due=x._d;x.fix=x._f}})}
function fbStat(x,t){const f=x.fb&&x.fb[t];return f?f.status:'Belum diisi'}
function renderFB(){
  title.textContent='Feedback Temuan';const tim=ME&&ME.tim;crumb.textContent='Safety Patrol › '+(tim||'-');
  if(!tim){view.innerHTML='<div class="card empty">Akun Anda belum memiliki departemen. Hubungi admin untuk mengaturnya di menu Setting.</div>';return}
  let h=`<div class="tools"><div style="min-width:180px"><label class="lb">Tampilkan</label><select onchange="fbF=this.value;render()">${[['all','Semua temuan'],['Belum diisi','Belum diisi feedback'],['Progress','Progress'],['Selesai','Selesai']].map(o=>`<option value="${o[0]}"${fbF===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div><div><button class="sm" onclick="loadSheet();loadFB()">↻ Muat ulang</button></div></div>`;
  if(shState==='idle'||shState==='loading'){view.innerHTML=h+'<div class="card empty">Memuat temuan…</div>';return}
  if(shState==='err'){view.innerHTML=h+`<div class="card empty" style="color:var(--r)">${esc(shErr)}</div>`;return}
  if(fbErr)h+=`<div class="card empty" style="color:var(--r);margin-bottom:10px">Feedback belum bisa dimuat: ${esc(fbErr)}</div>`;
  const mine=(SH||[]).filter(x=>x.pic.includes(tim)).sort((a,b)=>(b.d||'').localeCompare(a.d||'')),cnt=s=>mine.filter(x=>fbStat(x,tim)===s).length;
  h+=`<div class="cards" style="margin-bottom:14px"><div class="card k"><div class="n">${mine.length}</div><div class="l">Temuan ${esc(tim)}</div></div><div class="card k"><div class="n">${cnt('Belum diisi')}</div><div class="l">Belum diisi</div></div><div class="card k"><div class="n">${cnt('Progress')}</div><div class="l">Progress</div></div><div class="card k"><div class="n">${cnt('Selesai')}</div><div class="l">Selesai</div></div></div>`;
  const rows=mine.filter(x=>fbF==='all'||fbStat(x,tim)===fbF);VR=rows;
  h+=`<div class="wrap"><table><thead><tr><th>NO</th><th>TANGGAL</th><th>AREA</th><th>TEMUAN</th><th>FOTO</th><th>RISK</th><th>SARAN PERBAIKAN</th><th>DUE DATE</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody>`;
  rows.forEach((x,n)=>{const f=x.fb&&x.fb[tim],st=fbStat(x,tim),due=f?f.due:'',late=due&&st!=='Selesai'&&due<today;
    h+=`<tr><td class="c">${n+1}</td><td class="t">${fmtD(x.d)}</td><td class="t">${esc(x.area)}</td><td class="t">${esc(x.temuan)}</td><td class="c f">${fotoHtml(x,n)}</td><td class="c">${esc(x.risk||'-')}</td><td class="t">${esc(x.saran)}</td>
    <td class="t"${late?' style="color:var(--r);font-weight:600"':''}>${due?fmtD(due):'-'}${late?'<br><small>Lewat due date</small>':''}</td>
    <td><span class="b ${st==='Selesai'?'good':st==='Progress'?'warn':'neu'}">${st}</span>${f&&f.note?`<div class="l" style="margin-top:4px">${esc(f.note)}</div>`:''}${f&&f.by?`<div class="l" style="margin-top:2px">oleh ${esc(f.by)}</div>`:''}</td>

  if(!rows.length)h+=`<tr><td colspan="10" class="empty">${mine.length?'Tidak ada temuan pada filter ini':'Belum ada temuan untuk departemen '+esc(tim)}</td></tr>`;
  view.innerHTML=h+'</tbody></table></div>'}
function fbEdit(n){const x=VR[n],tim=ME.tim,f=x.fb&&x.fb[tim];
  dlgOpen('Feedback - '+(x.area||'Temuan'),[['Due Date','date'],['Status','sel',['Progress','Selesai']],['Catatan (opsional)']],[f?f.due:'',f?f.status:'Progress',f?f.note:''],
    async v=>{

// ---------- Stok Level Consumable (upload Excel ke folder Google Drive) ----------
let STK=null,stkErr='',stkBusy=false;
function loadStok(){
  if(!STOK_SCRIPT_URL){stkErr='URL Apps Script Stok Level Consumable belum diisi di index.html (STOK_SCRIPT_URL). Lihat petunjuk di Code-Stok.gs.';if(cur==='stok')render();return}
  jsonp({action:'stokInfo'},STOK_SCRIPT_URL).then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'Gagal membaca info file.');STK=j;stkErr=''})
    .catch(e=>{stkErr=e.message;STK=STK||null}).finally(()=>{if(cur==='stok')render()})}
const stkSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const stkTime=ms=>new Date(ms).toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace('.',':');
function renderStok(){
  title.textContent='Stok Level Consumable';crumb.textContent='Master Data Infra › Consumable';
  let h=`<div class="tools"><button class="sm" onclick="STK=null;stkErr='';loadStok();render()">↻ Muat ulang</button></div>`;
  if(stkErr)h+=`<div class="card empty" style="color:var(--r);margin-bottom:12px">${esc(stkErr)}</div>`;
  if(!STK&&!stkErr)h+='<div class="card empty">Memuat info file…</div>';
  else if(STK){
    h+=STK.exists
      ?`<div class="card info"><div><div class="l" style="margin-bottom:4px">File saat ini</div><b>📄 ${esc(STK.name)}</b><div class="l" style="margin-top:4px">${stkSize(STK.size)}</div></div>
        <div><div class="l" style="margin-bottom:4px">Last updated</div><b>${stkTime(STK.updated)}</b>${STK.by?`<div class="l" style="margin-top:4px">oleh ${esc(STK.by)}</div>`:''}</div>
        <div><a class="btnl p" href="${esc(STK.url)}" target="_blank" rel="noopener">Buka / unduh file</a></div></div>`
      :'<div class="card empty" style="margin-bottom:12px">Belum ada file. Upload file Excel pertama di bawah.</div>'}
  h+=`<div class="card" style="margin-top:12px"><b>Upload file baru</b>
    <div class="l" style="margin:4px 0 10px">Format .xlsx, .xls, .xlsm atau .csv. File lama otomatis dihapus (dipindah ke Sampah Google Drive) dan diganti file yang baru.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="file" id="stk_f" accept=".xlsx,.xls,.xlsm,.csv" style="max-width:340px"><button class="p" id="stk_b" onclick="stokUp()"${stkBusy?' disabled':''}>${stkBusy?'Mengunggah…':'Upload'}</button></div></div>`;
  view.innerHTML=h}
async function stokUp(){
  const inp=document.getElementById('stk_f'),f=inp&&inp.files[0];
  if(!f){alert('Pilih file Excel terlebih dahulu.');return}
  if(!/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)){alert('File harus berformat Excel (.xlsx, .xls, .xlsm) atau .csv');return}
  if(f.size>25*1048576){alert('File terlalu besar (maksimal 25 MB).');return}
  if(STK&&STK.exists&&!confirm('File "'+STK.name+'" akan dihapus dan diganti dengan "'+f.name+'".\nLanjutkan?'))return;
  if(!STOK_SCRIPT_URL){alert('URL Apps Script Stok Level Consumable belum diisi di index.html (STOK_SCRIPT_URL).');return}
  const pin=getPin('mi_pin_stok');if(!pin)return;
  stkBusy=true;render();toast('Mengunggah ke Google Drive…');
  try{
    const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(new Error('Gagal membaca file.'));r.readAsDataURL(f)});
    const res=await fetch(STOK_SCRIPT_URL,{method:'POST',mode:'cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'stokUpload',name:f.name,b64,by:ME?(ME.nama||ME.username):'',pin})});
    const j=await res.json();
    if(!j.ok){if(j.error==='PIN'){try{sessionStorage.removeItem('mi_pin_stok')}catch(e){}throw new Error('PIN salah.')}throw new Error(j.error||'Gagal mengunggah')}
    STK=j;stkErr='';toast('File berhasil diunggah ✓')
  }catch(e){tst.hidden=true;alert('Gagal mengunggah: '+e.message+(e instanceof TypeError?'\nPeriksa URL Apps Script dan pastikan Code.gs sudah di-deploy versi terbaru.':''))}
  stkBusy=false;if(cur==='stok')render()}


// ---------- MoU / Kerjasama (database + file di folder Google Drive, lewat Apps Script terpisah) ----------
let MOU=null,mouErr='',mouQ='',mouPl='',mouSt='',mouBusy=false,MOU_DB='';
const MOU_WARN=90;   // "Akan habis" bila sisa waktu <= 90 hari
const MOU_ST=['Aktif','Akan habis','Habis','Tidak berlaku'];
function mouStat(x){
  if(x.manual==='Tidak berlaku')return 'Tidak berlaku';
  if(!x.exp)return 'Aktif';
  const d=Math.round((new Date(x.exp+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);
  return d<0?'Habis':d<=MOU_WARN?'Akan habis':'Aktif'}
const mouCls=st=>st==='Aktif'?'good':st==='Akan habis'?'warn':st==='Habis'?'bad':'neu';
function loadMou(){
  if(!MOU_SCRIPT_URL){mouErr='URL Apps Script MoU belum diisi di index.html (MOU_SCRIPT_URL). Lihat petunjuk di Code-MoU.gs.';if(cur==='mou')render();return}
  jsonp({action:'mouList'},MOU_SCRIPT_URL).then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'Gagal membaca data MoU.');MOU=j.rows;MOU_DB=j.dbUrl||'';mouErr=''})
    .catch(e=>{mouErr=e.message}).finally(()=>{if(cur==='mou'||cur==='home')render()})}
async function mouPost(payload){
  if(!MOU_SCRIPT_URL){alert('URL Apps Script MoU belum diisi di index.html (MOU_SCRIPT_URL).');return null}
  const pin=getPin('mi_pin_mou');if(!pin)return null;
  toast('Menyimpan ke Google Drive…');
  try{
    const res=await fetch(MOU_SCRIPT_URL,{method:'POST',mode:'cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,by:ME?(ME.nama||ME.username):'',pin})});
    const j=await res.json();
    if(!j.ok){if(j.error==='PIN'){try{sessionStorage.removeItem('mi_pin_mou')}catch(e){}throw new Error('PIN salah.')}throw new Error(j.error||'Gagal menyimpan')}
    toast('Tersimpan ✓');return j
  }catch(e){tst.hidden=true;alert('Gagal menyimpan: '+e.message+(e instanceof TypeError?'\nPeriksa URL Apps Script dan pastikan Code-MoU.gs sudah di-deploy versi terbaru.':''));return null}}
function renderMou(){
  title.textContent='MoU / Kerjasama';crumb.textContent='Master Data Infra › Legal';
  let h='';
  if(mouErr)h+=`<div class="card empty" style="color:var(--r);margin-bottom:12px">${esc(mouErr)}</div>`;
  if(!MOU){view.innerHTML=h+(mouErr?'':'<div class="card empty">Memuat data MoU…</div>');return}
  const all=MOU.map((x,i)=>({...x,st:mouStat(x),_i:i})),cnt=s=>all.filter(x=>x.st===s).length;
  const plants=[...new Set([...PLANTS,...all.map(x=>x.plant)])];
  const qq=mouQ.toLowerCase();
  const rows=all.filter(x=>(!mouPl||x.plant===mouPl)&&(!mouSt||x.st===mouSt)&&(!qq||[x.plant,x.scope,x.vendor].join(' ').toLowerCase().includes(qq)))
    .sort((a,b)=>b._i-a._i);   // terbaru diisi di paling atas
  h+=`<div class="cards" style="margin-bottom:14px"><div class="card k"><div class="n">${all.length-cnt('Tidak berlaku')}</div><div class="l">Total MoU</div></div>${MOU_ST.map(s=>`<div class="card k" onclick="mouSt='${mouSt===s?'':s}';render()"><div class="n">${cnt(s)}</div><div class="l">${s}</div></div>`).join('')}</div>`;
  h+=`<div class="tools"><input class="s" style="max-width:300px" placeholder="Cari vendor, ruang lingkup..." value="${esc(mouQ)}" oninput="mouQ=this.value;rs(this)">
    <select style="width:auto;min-width:150px" onchange="mouPl=this.value;render()"><option value="">Semua Plant</option>${plants.map(p=>`<option${p===mouPl?' selected':''}>${esc(p)}</option>`).join('')}</select>
    <select style="width:auto;min-width:150px" onchange="mouSt=this.value;render()"><option value="">Semua status</option>${MOU_ST.map(s=>`<option${s===mouSt?' selected':''}>${s}</option>`).join('')}</select>
    <button class="sm" onclick="MOU=null;mouErr='';loadMou();render()">↻ Muat ulang</button>
    <button class="p" onclick="mouEdit(-1)">+ Tambah</button></div>`;
  window.MV2=rows;
  h+=`<div class="wrap"><table><thead><tr><th>NO</th><th>PLANT</th><th>RUANG LINGKUP</th><th>NAMA VENDOR</th><th>EXPIRED</th><th>STATUS</th><th>FILE</th><th></th></tr></thead><tbody>`;
  rows.forEach((x,i)=>{h+=`<tr><td class="c">${i+1}</td><td>${esc(x.plant)}</td><td>${esc(x.scope)}</td><td><b>${esc(x.vendor)}</b></td><td>${x.exp?fmtD(x.exp):'-'}</td><td><span class="b ${mouCls(x.st)}">${x.st}</span></td>
    <td>${x.fileUrl?`<a href="${esc(x.fileUrl)}" target="_blank" rel="noopener" title="${esc(x.fileName)}">📎 Buka file</a>`:'<span class="l">-</span>'}</td>

  if(!rows.length)h+=`<tr><td colspan="8" class="empty">${all.length?'Tidak ada data pada filter ini':'Belum ada data MoU. Klik + Tambah.'}</td></tr>`;

function mouEdit(i){
  const x=i>=0?window.MV2[i]:null;
  const cols=[['Plant','sel',PLANTS.includes(x&&x.plant)||!x?PLANTS:[...PLANTS,x.plant]],['Ruang Lingkup'],['Nama Vendor'],['Expired','date'],['Status','sel',['Otomatis (dari tanggal expired)','Tidak berlaku']],['File MoU (PDF/Word/Excel/gambar)'+(x&&x.fileName?' - sekarang: '+esc(x.fileName)+' (kosongkan bila tidak diganti)':''),'file']];
  dlgOpen((x?'Edit':'Tambah')+' MoU',cols,x?[x.plant,x.scope,x.vendor,x.exp,x.manual==='Tidak berlaku'?'Tidak berlaku':'Otomatis (dari tanggal expired)',''] : [PLANTS[0],'','','','',''],
    async v=>{
      if(!v[2]){alert('Nama vendor wajib diisi.');return false}
      const fi=fields.querySelectorAll('.fld')[5].querySelector('input'),f=fi&&fi.files[0];let file=null;
      if(f){
        if(!/\.(pdf|docx?|xlsx?|jpe?g|png)$/i.test(f.name)){alert('File harus PDF, Word, Excel, atau gambar (JPG/PNG).');return false}
        if(f.size>25*1048576){alert('File terlalu besar (maksimal 25 MB).');return false}
        const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(new Error('Gagal membaca file.'));r.readAsDataURL(f)});
        file={name:f.name,b64}}
      const j=await mouPost({action:'mouSave',id:x?x.id:'',plant:v[0],scope:v[1],vendor:v[2],no:x?x.no:'',exp:v[3],manual:v[4]==='Tidak berlaku'?'Tidak berlaku':'',file});
      if(!j)return false;
      const k=MOU.findIndex(z=>z.id===j.row.id);if(k>=0)MOU[k]=j.row;else MOU.push(j.row)},false)}
async function mouDel(i){
  if(!canDel())return deny();const x=window.MV2[i];
  if(!confirm('Hapus MoU "'+x.vendor+'"?\nFile di Google Drive ikut dipindah ke Sampah.'))return;
  const j=await mouPost({action:'mouDelete',id:x.id});if(!j)return;

// ---------- filter per kolom (otomatis di semua tabel sederhana) ----------
const TF={};
const tfText=td=>{const sl=td.querySelector&&td.querySelector('select');return (sl&&sl.selectedIndex>=0?sl.options[sl.selectedIndex].text:td.textContent).trim()};
function tfApply(t){
  const f=[...t.querySelectorAll('.tf [data-c]')].map(e=>[+e.dataset.c,e.value.trim().toLowerCase(),e.tagName==='SELECT']).filter(x=>x[1]);
  const nc=t.tHead.rows[0].cells.length;

<script type="module">
// ====================================================================
//  FIREBASE APAR  (project: checksheet-apar)  -  Firestore
//  Koleksi: apar_master, apar_hasil, apar_histori.  Aturan keamanan: file firestore.rules
// ====================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcIQKREBhEt1B0p94QZmCnn-RLc6Re6PI",
  authDomain: "checksheet-apar.firebaseapp.com",
  projectId: "checksheet-apar",
  storageBucket: "checksheet-apar.firebasestorage.app",
  messagingSenderId: "197433286609",
  appId: "1:197433286609:web:909e645090dc0e87a84af0"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });   // cache offline otomatis

const JENIS = ['Dry Chemical', 'CO2', 'Lithium'], HJ = ['Pengisian', 'Pembelian'];
const ITEMS = ['pin','segel','tuas','selang','nozzle','tabung','gauge','suara','timah','roda'];
const cl = (v, n) => String(v == null ? '' : v).trim().slice(0, n || 200);
const did = (...a) => a.map(x => String(x).replace(/\//g, '-')).join('__');
const isD = x => /^\d{4}-\d{2}-\d{2}$/.test(x);
const stamp = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const C = n => collection(db, n);

function cancelled() { const e = new Error('Dibatalkan'); e.cancelled = true; return e; }


// ---------- baca ----------
const byTs = (a, b) => (a.ts || 0) - (b.ts || 0);
async function read(p) {
  if (p.action === 'aparMaster') {
    const sn = await getDocs(C('apar_master'));
    const rows = sn.docs.map(d => d.data()).sort(byTs).map(x => ({ kode: x.kode, plant: x.plant, jenis: x.jenis, kap: String(x.kap ?? ''), lokasi: x.lokasi, exp: x.exp || '' }));
    return { ok: true, rows };
  }
  if (p.action === 'aparResults') {
    const y = String(p.year || '');
    const sn = await getDocs(y ? query(C('apar_hasil'), where('bulan', '>=', y + '-01'), where('bulan', '<=', y + '-12')) : C('apar_hasil'));
    const rows = sn.docs.map(d => d.data()).sort((a, b) => (a.tgl + a.kode).localeCompare(b.tgl + b.kode))
      .map(x => ({ bulan: x.bulan, tgl: x.tgl, kode: x.kode, plant: x.plant, lokasi: x.lokasi, jenis: x.jenis, kap: String(x.kap ?? ''), items: x.items || {}, berat: x.berat == null ? '' : String(x.berat), petugas: x.petugas, catatan: x.catatan || '' }));
    return { ok: true, rows };
  }
  if (p.action === 'aparHist') {
    const sn = await getDocs(C('apar_histori'));
    const rows = sn.docs.map(d => d.data()).sort((a, b) => String(a.id).localeCompare(String(b.id)))
      .map(x => ({ id: x.id, tgl: x.tgl, plant: x.plant, kode: x.kode, jenis: x.jenis, ket: x.ket || '' }));
    return { ok: true, rows };
  }
  throw new Error('Aksi tidak dikenal: ' + p.action);
}

// ---------- tulis (admin) ----------
function chkMaster(q) {
  const jenis = cl(q.jenis), lokasi = cl(q.lokasi), exp = cl(q.exp), kap = parseFloat(q.kap);
  if (!JENIS.includes(jenis)) throw new Error('Jenis tidak valid');
  if (!(kap > 0)) throw new Error('Kapasitas harus lebih dari 0');
  if (!lokasi) throw new Error('Lokasi wajib diisi');
  if (exp && !isD(exp)) throw new Error('Format tanggal expired tidak valid');
  return { jenis, kap: String(kap), lokasi, exp };
}
async function nextId(col, prefix, field, filter) {
  const sn = await getDocs(filter ? query(C(col), filter) : C(col));
  const re = new RegExp('^' + prefix + '(\\d+)$');
  let max = 0;
  sn.forEach(d => { const m = re.exec(String(d.data()[field] || '')); if (m) max = Math.max(max, +m[1]); });
  return prefix + String(max + 1).padStart(3, '0');
}
async function write(q) {
  const a = q.action;
  if (a === 'aparAdd') {
    const plant = cl(q.plant); if (!plant) throw new Error('Plant wajib diisi');
    const f = chkMaster(q);
    const kode = await nextId('apar_master', 'APAR', 'kode', where('plant', '==', plant));
    await setDoc(doc(db, 'apar_master', did(plant, kode)), { kode, plant, ...f, ts: Date.now() });
    return { ok: true, kode, exp: f.exp };
  }
  if (a === 'aparUpdate') {
    const f = chkMaster(q), r = doc(db, 'apar_master', did(cl(q.plant), cl(q.kode)));
    await updateDoc(r, f);
    return { ok: true, exp: f.exp };
  }
  if (a === 'aparDelete') { await deleteDoc(doc(db, 'apar_master', did(cl(q.plant), cl(q.kode)))); return { ok: true }; }
  if (a === 'aparHistAdd' || a === 'aparHistUpdate') {
    const jenis = cl(q.jenis), tgl = cl(q.tgl), ket = cl(q.ket, 500);
    if (!HJ.includes(jenis)) throw new Error('Jenis transaksi tidak valid');
    if (!tgl) throw new Error('Tanggal transaksi wajib diisi');
    if (!isD(tgl)) throw new Error('Format Tanggal transaksi tidak valid');
    if (a === 'aparHistUpdate') { await updateDoc(doc(db, 'apar_histori', cl(q.id)), { tgl, jenis, ket }); return { ok: true }; }
    const plant = cl(q.plant), kode = cl(q.kode);
    if (!(await getDoc(doc(db, 'apar_master', did(plant, kode)))).exists()) throw new Error('Kode alat tidak ditemukan di plant tersebut');
    const id = await nextId('apar_histori', 'TRX', 'id');
    await setDoc(doc(db, 'apar_histori', id), { id, tgl, plant, kode, jenis, ket, waktu: stamp() });
    return { ok: true, id };
  }
  if (a === 'aparHistDelete') { await deleteDoc(doc(db, 'apar_histori', cl(q.id))); return { ok: true }; }
  throw new Error('Aksi tidak dikenal: ' + a);
}

// ---------- kirim checksheet (petugas, tanpa login) ----------
async function submit(q) {
  const plant = cl(q.plant), kode = cl(q.kode);
  if (!plant) throw new Error('Plant tidak diketahui. Buka ulang lewat QR code alat.');
  const mref = doc(db, 'apar_master', did(plant, kode)), ms = await getDoc(mref);
  if (!ms.exists()) throw new Error('Kode alat tidak ditemukan di master data');
  const a = ms.data();
  const exp = cl(q.exp);
  if (exp && !isD(exp)) throw new Error('Format tanggal expired tidak valid');
  if (!exp && !a.exp) throw new Error('Tanggal expired wajib diisi');
  const tgl = cl(q.tanggal);
  if (!isD(tgl)) throw new Error('Tanggal tidak valid');
  const petugas = cl(q.petugas, 100);
  if (!petugas) throw new Error('Nama petugas wajib diisi');
  const it = q.items || {}, items = {};
  ITEMS.forEach(k => { const v = String(it[k] || ''); if (!['OK', 'NG', 'NA'].includes(v)) throw new Error('Semua item pemeriksaan wajib dipilih'); items[k] = v; });
  let berat = '';
  if (a.jenis === 'CO2') { const b = parseFloat(q.berat); if (!(b > 0)) throw new Error('Berat (kg) wajib diisi untuk APAR CO2'); berat = String(b); }
  const bulan = tgl.slice(0, 7), href = doc(db, 'apar_hasil', did(plant, kode, bulan));
  let updated = false; try { updated = (await getDoc(href)).exists(); } catch (e) {}
  const expUpdated = !!(exp && exp !== String(a.exp || ''));
  const b = writeBatch(db);
  if (expUpdated) b.update(mref, { exp });
  b.set(href, { bulan, tgl, kode, plant, lokasi: a.lokasi, jenis: a.jenis, kap: String(a.kap ?? ''), items, berat, petugas, catatan: cl(q.catatan, 500), waktu: stamp() });
  const pr = b.commit(); pr.catch(() => {});
  const r = await Promise.race([pr.then(() => 'ok'), sleep(8000).then(() => 'queued')]);   // offline: tersimpan di HP, terkirim saat online
  return { ok: true, updated, bulan, expUpdated, queued: r === 'queued' };
}

const guard = (fn, ms, msg) => (...a) => Promise.race([fn(...a), new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
const ERR_A = 'Tidak bisa terhubung ke database Firebase APAR. Pastikan Firestore sudah dibuat (Create database) dan aturan firestore.rules sudah di-Publish di project checksheet-apar, lalu muat ulang halaman.';
window.FBA = { read: guard(read, 15000, ERR_A), write: guard(write, 15000, ERR_A.replace('Tidak bisa terhubung', 'Penyimpanan belum terkonfirmasi. Tidak bisa terhubung')), submit };
window.__fbaOk(window.FBA);
</script>

    const guard = (fn, ms, msg) => (...a) => Promise.race([fn(...a), new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
  const ERR_H = 'Tidak bisa terhubung ke database Firebase Hydrant. Pastikan Firestore sudah dibuat (Create database) dan aturan firestore-hydrant.rules sudah di-Publish di project checksheet-hydrant, lalu muat ulang halaman.';
  window.FBH = { read: guard(read, 15000, ERR_H), write: guard(write, 15000, ERR_H.replace('Tidak bisa terhubung', 'Penyimpanan belum terkonfirmasi. Tidak bisa terhubung')), submit };
}
window.__fbhOk(window.FBH);
</script>
<script type="module">
// ====================================================================
//  FIREBASE LOGIN / AKUN  (project ketiga, khusus Authentication + daftar akun)  -  firestore-auth.rules
//  Koleksi: users/{uid} = {username,email,role,createdAt};  usernames/{username} = {uid,email}
// ====================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, deleteUser as delAuthUser } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

// ===== firebaseConfig project Login/Akun (master-infra-62ef3) =====
const firebaseConfig = {
  apiKey: "AIzaSyD40dXwDhf3e-K8AQi6y39c3_yFntMPbEg",
  authDomain: "master-infra-62ef3.firebaseapp.com",
  projectId: "master-infra-62ef3",
  storageBucket: "master-infra-62ef3.firebasestorage.app",
  messagingSenderId: "24442447235",
  appId: "1:24442447235:web:3cac8ae50476a5c989c2b6"
};
// Pemilik: akun dengan email ini otomatis menjadi username "infra" dengan role Admin (1) (harus sama dengan firestore-auth.rules)
const OWNER_EMAIL = 'stefanus.atmaja@aop.component.astra.co.id', OWNER_USER = 'infra', RESERVED = ['admin', 'infra'];

if (/^ISI/.test(firebaseConfig.apiKey)) {
  window.AUTHX = { enabled: false };   // belum dikonfigurasi: website berjalan tanpa login
} else {
  const app = initializeApp(firebaseConfig, 'auth');
  const db = getFirestore(app), auth = getAuth(app);
  const UN = /^[a-z0-9._-]{3,20}$/;
  const TIMS = ['Warehouse', 'Lokal proses', 'TMCC', 'Quality', 'Infra', 'Security'];
  let meName = '';
  const norm = s => String(s || '').trim().toLowerCase();
  const fail = m => { throw new Error(m); };
  const msg = e => {
    const c = String(e && e.code || '');
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username/email atau password salah.';
    if (c.includes('email-already-in-use')) return 'Email sudah terdaftar. Gunakan Lupa password bila lupa passwordnya.';
    if (c.includes('weak-password')) return 'Password minimal 6 karakter.';
    if (c.includes('invalid-email')) return 'Format email tidak valid.';
    if (c.includes('too-many-requests')) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
    if (c.includes('network')) return 'Tidak ada koneksi internet.';
    if (c.includes('operation-not-allowed') || c.includes('configuration-not-found')) return 'Authentication belum diaktifkan di project Firebase login. Buka Authentication > Get started > Sign-in method > Email/Password > Enable > Save.';
    if (c.includes('permission-denied') || /insufficient permissions/i.test(e && e.message || '')) return 'Ditolak oleh aturan database. Pastikan firestore-auth.rules sudah di-Publish.';
    return (e && e.message) || 'Terjadi kesalahan.';
  };
  const wrap = f => async (...a) => { try { return await f(...a); } catch (e) { throw new Error(msg(e)); } };
  const emailOf = async v => {
    v = norm(v); if (!v) fail('Username atau email wajib diisi.');
    if (v.includes('@')) return v;
    const s = await getDoc(doc(db, 'usernames', v));
    return s.exists() ? s.data().email : null;
  };
  async function profileOf(user) {
    const r = doc(db, 'users', user.uid);
    let s = await getDoc(r);
    if (!s.exists()) {
      if (norm(user.email) !== OWNER_EMAIL) return null;
      const b = writeBatch(db);   // pemilik pertama kali masuk: buat profil Role 1
      b.set(r, { username: OWNER_USER, email: norm(user.email), role: 1, createdAt: Date.now() });
      b.set(doc(db, 'usernames', OWNER_USER), { uid: user.uid, email: norm(user.email) });
      await b.commit(); s = await getDoc(r);
    }
    return { uid: user.uid, ...s.data() };
  }
  let cb = null, regBusy = false;
  async function handle(user) {
    if (!cb) return;
    if (!user) { cb(null); return; }
    try {
      const p = await profileOf(user);
      if (!p) { await signOut(auth); cb(null, 'Akun ini tidak terdaftar atau sudah dihapus oleh admin.'); return; }
      meName = p.username; cb(p);
    } catch (e) { cb(null, msg(e)); }
  }
  window.AUTHX = {
    enabled: true,
    onAuth: f => { cb = f; onAuthStateChanged(auth, u => { if (!regBusy) handle(u); }); },
    login: wrap(async (id, pw) => {
      if (!pw) fail('Password wajib diisi.');
      const email = await emailOf(id);
      if (!email) fail('Username/email atau password salah.');
      await signInWithEmailAndPassword(auth, email, pw);
    }),
    register: wrap(async ({ nama, username, email, tim, password, password2 }) => {
      const nm = String(nama || '').trim().replace(/\s+/g, ' ');
      if (nm.length < 2 || nm.length > 60) fail('Nama lengkap wajib diisi (2–60 karakter).');
      const e = norm(email), owner = e === OWNER_EMAIL, un = owner ? OWNER_USER : norm(username);
      if (!UN.test(un)) fail('Username 3–20 karakter: huruf kecil, angka, titik, garis bawah, atau strip.');
      if (RESERVED.includes(un) && !owner) fail('Username "' + un + '" tidak tersedia.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) fail('Format email tidak valid.');
      if (!owner && !TIMS.includes(tim)) fail('Pilih departemen Anda.');
      if (String(password || '').length < 6) fail('Password minimal 6 karakter.');
      if (password !== password2) fail('Ulangi password tidak sama.');
      if ((await getDoc(doc(db, 'usernames', un))).exists()) fail('Username sudah dipakai.');
      regBusy = true;
      try {
        const cred = await createUserWithEmailAndPassword(auth, e, password);
        try {
          const b = writeBatch(db);
          b.set(doc(db, 'users', cred.user.uid), owner ? { username: un, nama: nm, email: e, role: 1, createdAt: Date.now() } : { username: un, nama: nm, email: e, role: tim === 'Infra' ? 3 : 4, tim, createdAt: Date.now() });
          b.set(doc(db, 'usernames', un), { uid: cred.user.uid, email: e });
          await b.commit();
        } catch (err) { try { await delAuthUser(cred.user); } catch (_) {} throw err; }
      } finally { regBusy = false; }
      await handle(auth.currentUser);
    }),
    logout: () => signOut(auth),
    resetPassword: wrap(async id => { const e = await emailOf(id); if (e) { try { await sendPasswordResetEmail(auth, e); } catch (x) { if (!/user-not-found/.test(String(x.code))) throw x; } } }),
    resetEmail: wrap(async email => { await sendPasswordResetEmail(auth, norm(email)); }),
    listUsers: wrap(async () => (await getDocs(collection(db, 'users'))).docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))),
    updateRole: wrap(async (uid, role) => { if (![1, 2, 3, 4].includes(role)) fail('Role tidak valid'); await updateDoc(doc(db, 'users', uid), { role }); }),
    updateTim: wrap(async (uid, tim) => { if (!TIMS.includes(tim)) fail('Departemen tidak valid'); await updateDoc(doc(db, 'users', uid), { tim }); }),
    fbList: wrap(async () => (await getDocs(collection(db, 'feedback'))).docs.map(d => ({ id: d.id, ...d.data() }))),
    fbSet: wrap(async (id, d) => {
      if (!['Progress', 'Selesai'].includes(d.status)) fail('Status tidak valid');
      await setDoc(doc(db, 'feedback', id), { key: String(d.key), tim: d.tim, due: d.due || '', status: d.status, note: d.note || '', by: meName, at: Date.now() });
    }),
    deleteUser: wrap(async (uid, username) => {
      const b = writeBatch(db); b.delete(doc(db, 'users', uid)); if (username) b.delete(doc(db, 'usernames', norm(username))); await b.commit();
    })
  };
}
window.__authOk(window.AUTHX);
</script>
