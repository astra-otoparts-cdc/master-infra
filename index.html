function isoDate(c){if(!c||c.v==null)return '';const v=c.v;if(typeof v!=='string')return '';
  let m=v.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${m[3].padStart(2,'0')}`;

  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; // format M/D/YYYY

    if(g==='Safety'){
      h+=`<a onclick="subOpen=!subOpen;nav()">Safety Patrol<span class="car">${subOpen?'▾':'▸'}</span></a>`;
      if(subOpen)h+=`<div class="sub">${a('pic','PIC')}${a('leader','Leader')}</div>`;
    }
  }
  side.innerHTML=h;
}
function go(k){cur=k;q='';if(k==='pic'||k==='leader')subOpen=true;location.hash=k;side.classList.remove('open');nav();render()}

function render(){
  if(cur==='home'){title.textContent='Dashboard';crumb.textContent='Master Infra';
    let h='';
    for(const g of GRP){h+=`<h3>${ICON[g]} ${g}</h3><div class="cards" style="margin-bottom:20px">`;
      for(const k in ALL)if(ALL[k].g===g){
        const isL=k==='leader',n=isL?(SH?SH.length:'…'):D[k].length,al=isL?(SH?SH.filter(r=>r.risk==='A').length:0):D[k].filter(r=>cls(r[r.length-1])==='bad').length;
        h+=`<div class="card k" onclick="go('${k}')"><div class="n">${n}</div><div class="l">${isL?'Temuan Safety Patrol (Leader)':ALL[k].t}</div><div class="l" style="color:var(--r);margin-top:4px">${al?al+(isL?' risiko rank A':' perlu perhatian'):'&nbsp;'}</div></div>`}
      h+='</div>'}
    view.innerHTML=h;return}
  const p=ALL[cur];title.textContent=cur==='leader'?'Leader - Safety Patrol':p.t;
  crumb.textContent='Master Infra › '+p.g+(p.parent?' › Safety Patrol':'');
  if(cur==='leader')return renderLeader();
  const rows=D[cur].map((r,i)=>[r,i]).filter(([r])=>r.join(' ').toLowerCase().includes(q.toLowerCase()));
  let h=`<div class="tools"><input class="s" placeholder="Cari..." value="${esc(q)}" oninput="q=this.value;rs(this)"><button class="p" onclick="openF(-1)">+ Tambah</button></div><div class="wrap"><table><thead><tr>`;
  p.c.forEach(c=>h+=`<th>${c[0]}</th>`);h+='<th></th></tr></thead><tbody>';
  rows.forEach(([r,i])=>{h+='<tr>';r.forEach((v,j)=>{h+=p.c[j][1]==='sel'?`<td><span class="b ${cls(v)}">${esc(v)}</span></td>`:`<td>${esc(v)}</td>`});h+=`<td><button class="sm" onclick="openF(${i})">Edit</button> <button class="sm" onclick="del(${i})">Hapus</button></td></tr>`});
  h+='</tbody></table>'+(rows.length?'':'<div class="empty">Belum ada data</div>')+'</div>';
  view.innerHTML=h;
}
function rs(el){const pos=el.selectionStart;render();const i=view.querySelector('input');i.focus();i.setSelectionRange(pos,pos)}

const LEG=`<div class="leg"><div><div class="lt">KATEGORI STOP 6</div><table class="lg">${[['A','APPARATUS','Terjepit mesin'],['B','BIG HEAVY','Kejatuhan benda berat'],['C','CAR','Tertabrak kendaraan'],['D','DROP','Terjatuh dari ketinggian'],['E','ELECTRICAL','Tersengat listrik atau akibat listrik'],['F','FIRE','Terkena panas atau kebakaran'],['O','OTHERS','Potensi bahaya diluar kategori diatas']].map(x=>`<tr><td class="k">${x[0]}</td><td>: ${x[1]} (${x[2]})</td></tr>`).join('')}</table></div>
<div><div class="lt">RISK RANK</div><table class="lg">${[['A',['Kematian','Kehilangan anggota tubuh','Kehilangan fungsi tubuh']],['B',['Cidera','Produksi terhenti','Kehilangan hari kerja']],['C',['Cidera ringan','Produksi tidak terhenti','Tidak ada kehilangan hari kerja']]].map(x=>`<tr><td class="rr r${x[0]}">RANK ${x[0]}</td><td>${x[1].map(i=>'- '+i).join('<br>')}</td></tr>`).join('')}</table></div></div>`;
let VR=[],LB=null;
function fotoHtml(x,ri){return x.fotos.length?x.fotos.map((id,j)=>`<a href="https://drive.google.com/open?id=${id}" onclick="openLB(${ri},${j});return false"><img class="ph" src="https://lh3.googleusercontent.com/d/${id}=w600" loading="lazy" referrerpolicy="no-referrer" alt="Foto temuan" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://drive.google.com/thumbnail?id=${id}&sz=w600'}else{this.outerHTML='📷 Buka foto'}"></a>`).join(''):'-'}
function openLB(ri,i){if(!VR[ri]||!VR[ri].fotos.length)return;LB={ri,i};showLB();try{history.pushState({lb:1},'')}catch(e){}}
function showLB(){const x=VR[LB.ri],id=x.fotos[LB.i];lb.hidden=false;document.body.style.overflow='hidden';
  lbi.dataset.f='';lbi.onerror=()=>{if(!lbi.dataset.f){lbi.dataset.f=1;lbi.src='https://drive.google.com/thumbnail?id='+id+'&sz=w1600'}};
  lbi.src='https://lh3.googleusercontent.com/d/'+id+'=w1600';lba.href='https://drive.google.com/open?id='+id;
  lbc.textContent=(x.area||'Foto temuan')+(x.fotos.length>1?` · ${LB.i+1}/${x.fotos.length}`:'');lbp.hidden=lbn.hidden=x.fotos.length<2}
function stepLB(d){const n=VR[LB.ri].fotos.length;LB.i=(LB.i+d+n)%n;showLB()}
function closeLB(pop){if(lb.hidden)return;lb.hidden=true;lbi.onerror=null;lbi.removeAttribute('src');document.body.style.overflow='';LB=null;
  if(!pop&&history.state&&history.state.lb){try{history.back()}catch(e){}}}
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('lbm'))closeLB()});
addEventListener('popstate',()=>closeLB(true));
addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight'&&VR[LB.ri].fotos.length>1)stepLB(1);if(e.key==='ArrowLeft'&&VR[LB.ri].fotos.length>1)stepLB(-1)});
const infoOf=()=>{const i=SI[ld+'|'+lt]||{};return {member:i.member||'',zona:i.zona||DEFAULT_ZONA}};
async function setZona(v){const inf=infoOf(),j=await api({action:'setInfo',tgl:ld,tim:lt,member:inf.member,zona:v});if(j)SI[ld+'|'+lt]={member:inf.member,zona:v};render()}
function renderLeader(){
  const inf=infoOf();
  let h=`<div class="tools"><div style="min-width:160px"><label class="lb">Team</label><select onchange="lt=this.value;render()">${TEAMS.map(t=>`<option value="${t}"${String(t)===lt?' selected':''}>Tim ${t}</option>`).join('')}</select></div>
  <div style="min-width:190px"><label class="lb">Tanggal Pemantauan</label><input type="date" value="${esc(ld)}" onchange="ld=this.value;render()"></div></div>`;
  if(!ld){view.innerHTML=h+'<div class="card empty">Pilih tanggal pemantauan terlebih dahulu.</div>';return}
  const chips=inf.member.split(',').map(x=>x.trim()).filter(Boolean).map(m=>`<span class="b neu chip">${esc(m)}</span>`).join('')||'-';
  const zs=ZONES.includes(inf.zona)?ZONES:[...ZONES,inf.zona];
  h+=`<div class="card info"><div><div class="l" style="margin-bottom:4px">Tanggal Pemantauan</div><b>${fmt(ld)}</b></div><div><div class="l" style="margin-bottom:4px">Zona</div><select onchange="setZona(this.value)">${zs.map(z=>`<option value="${esc(z)}"${z===inf.zona?' selected':''}>${esc(z)}</option>`).join('')}</select></div><div><div class="l">Member <button class="sm" style="margin-left:6px" onclick="editInfo()">Edit</button></div>${chips}</div></div>`;
  h+=`<div class="sec"><h3>Temuan - Tim ${lt}</h3><div><button class="sm" onclick="loadSheet()">↻ Muat ulang</button> <a class="btnl" href="${SHEET_URL}" target="_blank" rel="noopener">Buka Spreadsheet</a></div></div>`;
  if(shState==='idle'||shState==='loading'){view.innerHTML=h+'<div class="card empty">Memuat data dari Google Sheets…</div>';return}
  if(shState==='err'){view.innerHTML=h+`<div class="card empty" style="color:var(--r)">${esc(shErr)}</div>`;return}
  const rows=SH.filter(x=>x.d===ld&&x.n===lt);VR=rows;
  const mk=(on,c='')=>`<td class="c ${on?c:''}">${on?'<span class="ck">✓</span>':''}</td>`;
  h+=`<div class="wrap"><table class="fd"><thead>
  <tr><th rowspan="2">NO</th><th rowspan="2">AREA</th><th rowspan="2">TEMUAN</th><th rowspan="2">FOTO TEMUAN</th><th colspan="3">KATEGORI</th><th colspan="7">STOP 6</th><th colspan="3">RISK RANK</th><th rowspan="2">SARAN TINDAKAN PERBAIKAN</th><th rowspan="2">AKSI</th></tr>
  <tr>${KAT.map(k=>`<th>${k.toUpperCase()}</th>`).join('')}${STOP.map(k=>`<th>${k}</th>`).join('')}${RISK.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach((x,n)=>{h+=`<tr><td class="c">${n+1}</td><td class="t">${esc(x.area)}</td><td class="t">${esc(x.temuan)}</td><td class="c f">${fotoHtml(x,n)}</td>`
    +KAT.map(k=>mk(x.kat.includes(k.toLowerCase()))).join('')+STOP.map(k=>mk(x.stop.includes(k))).join('')+RISK.map(k=>mk(x.risk===k,'r'+k)).join('')
    +`<td class="t">${esc(x.saran)}</td><td class="c"><div class="ac"><button class="sm" onclick="editT(${n})">Edit</button><button class="sm" onclick="delT(${n})">Hapus</button></div></td></tr>`});
  if(!rows.length)h+=`<tr><td colspan="19" class="empty">Belum ada temuan untuk Tim ${lt} pada tanggal ini</td></tr>`;
  h+='</tbody></table></div>';
  const oth=SH.filter(x=>x.d===ld&&x.n!==lt);
  if(!rows.length&&oth.length)h+=`<div class="l" style="margin-top:8px">Ada ${oth.length} temuan pada tanggal ini dengan isian Tim: ${[...new Set(oth.map(x=>x.tim||'(kosong)'))].map(esc).join(', ')}.</div>`;
  view.innerHTML=h+LEG;
}
function dlgOpen(ttl,cols,vals,cb,req=true){onSave=cb;needFirst=req;dt.textContent=ttl;
  fields.innerHTML=cols.map((c,j)=>{const v=vals[j]??'';let inp;
    if(c[1]==='sel')inp=`<select>${c[2].map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)||'— Pilih —'}</option>`).join('')}</select>`;
    else if(c[1]==='chk')inp=`<div class="chk">${c[2].map(o=>`<label class="ci"><input type="checkbox" value="${esc(o)}"${(v||[]).includes(o)?' checked':''}> ${esc(o)}</label>`).join('')}</div>`;
    else inp=`<input type="${c[1]||'text'}" value="${esc(v)}">`;
    return `<div class="fld" data-t="${c[1]||''}"><label>${c[0]}</label>${inp}</div>`}).join('');
  dlg.showModal()}
async function save(){const v=[...fields.querySelectorAll('.fld')].map(f=>f.dataset.t==='chk'?[...f.querySelectorAll('input:checked')].map(i=>i.value):f.querySelector('input,select').value.trim());
  if(needFirst&&!v[0]){fields.querySelector('input,select').focus();return}
  sbtn.disabled=true;sbtn.textContent='Menyimpan…';let res;
  try{res=await onSave(v)}finally{sbtn.disabled=false;sbtn.textContent='Simpan'}
  if(res===false)return;sv();dlg.close();render()}
function openF(i){dlgOpen((i>=0?'Edit ':'Tambah ')+P[cur].t,P[cur].c,i>=0?D[cur][i]:[],v=>{i>=0?D[cur][i]=v:D[cur].push(v)})}
function del(i){if(confirm('Hapus data ini?')){D[cur].splice(i,1);sv();render()}}
function editInfo(){const inf=infoOf();
  dlgOpen('Member - Tim '+lt,[['Member (pisahkan dengan koma)']],[inf.member],async v=>{
    const j=await api({action:'setInfo',tgl:ld,tim:lt,member:v[0],zona:inf.zona});if(!j)return false;SI[ld+'|'+lt]={member:v[0],zona:inf.zona}},false)}
function editT(i){const x=VR[i];
  dlgOpen('Edit Temuan',[['Area'],['Temuan'],['Kategori','chk',KAT],['STOP 6','chk',STOP],['Risk Rank','sel',['',...RISK]],['Saran Tindakan Perbaikan']],
    [x.area,x.temuan,KAT.filter(k=>x.kat.includes(k.toLowerCase())),x.stop,x.risk,x.saran],
    async v=>{
      const d={area:v[0],temuan:v[1],kat:v[2].join(', '),saran:v[5]};
      if([...v[3]].sort().join()!==[...x.stop].sort().join())d.stop=v[3].map(l=>STOPL[l]).join(', ');
      if(v[4]!==x.risk)d.risk=RISKL[v[4]]||'';
      const j=await api({action:'update',row:x.row,ts:x.ts,area0:x.area,temuan0:x.temuan,data:d});if(!j)return false;
      if(j.row)x.row=j.row;
      Object.assign(x,{area:v[0],temuan:v[1],kat:v[2].map(k=>k.toLowerCase()),stop:v[3],risk:v[4],saran:v[5]});
      loadSheet(true)})}
async function delT(i){const x=VR[i];if(!confirm('Hapus temuan ini dari Google Sheets?\nTindakan ini tidak dapat dibatalkan.'))return;
  const j=await api({action:'delete',row:x.row,ts:x.ts,area0:x.area,temuan0:x.temuan});if(!j)return;
  const r0=j.row||x.row;SH=SH.filter(y=>y!==x);SH.forEach(y=>{if(y.row>r0)y.row--});render();loadSheet(true)}
const h0=location.hash.slice(1);
if(ALL[h0]){cur=h0;subOpen=!!ALL[h0].parent}
nav();render();loadSheet();loadZones();loadInfo();
</script>
</body>
</html>
