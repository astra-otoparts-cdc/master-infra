function psSet(k,v){PS.items[k]=v;document.querySelectorAll('.itm[data-k="'+k+'"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
async function psSubmit(){
  const a=PS.a,e=m=>{document.getElementById('pserr').textContent=m};e('');
  const miss=AITEMS.filter(([k])=>!PS.items[k]);
  if(miss.length)return e('Pilih ✓, — atau ○ untuk semua item. Belum dipilih: '+miss.map(x=>x[1]).join(', ')+'.');
  if(a.jenis==='CO2'&&!(parseFloat(PS.berat)>0))return e('Berat (kg) wajib diisi untuk APAR CO2.');
  if(!PS.exp)return e('Tanggal expired wajib diisi.');
  if(!PS.tgl)return e('Tanggal pemeriksaan wajib diisi.');
  if(!PS.petugas.trim())return e('Nama petugas wajib diisi.');
  const b=document.getElementById('psbtn');b.disabled=true;b.textContent='Mengirim…';
  try{
    const f=await fbaReady();
    const j=await f.submit({kode:a.kode,plant:a.plant,exp:PS.exp,tanggal:PS.tgl,petugas:PS.petugas.trim(),items:PS.items,berat:PS.berat,catatan:PS.catatan});
    try{localStorage.setItem('mi_petugas',PS.petugas.trim())}catch(x){}
    const [yy,mm]=j.bulan.split('-');
    view.innerHTML=`<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:54px;color:#16a34a">✓</div><div style="font-size:19px;font-weight:700;margin:6px 0">Checksheet tersimpan</div><div>${esc(a.kode)} · ${esc(a.plant)}</div><div class="l" style="margin:6px 0 16px">Bulan ${BLNF[+mm-1]} ${yy}${j.updated?' (menggantikan isian sebelumnya di bulan yang sama)':''}</div>${j.expUpdated?`<div class="l" style="margin:-8px 0 14px">Tanggal expired diperbarui menjadi ${esc(fmtD(PS.exp))}</div>`:''}${j.queued?`<div class="l" style="margin:-8px 0 14px;color:var(--r)">Belum ada sinyal: data tersimpan di HP ini dan akan terkirim otomatis saat HP kembali online (buka halaman ini lagi).</div>`:''}<button class="p" onclick="location.reload()">Isi lagi</button></div>`;
  }catch(x){b.disabled=false;b.textContent='Kirim Checksheet';e('Gagal mengirim: '+x.message+(x instanceof TypeError?' (periksa koneksi internet)':''))}
}

<script type="module">
// ====================================================================
//  FIREBASE APAR  (project: checksheet-apar)  -  Firestore
//  Koleksi: apar_master, apar_hasil, apar_histori.  Aturan keamanan: file firestore.rules
// ====================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcIQKREBhEt1B0p94QZmCnn-RLc6Re6PI",
  authDomain: "checksheet-apar.firebaseapp.com",
  projectId: "checksheet-apar",
  storageBucket: "checksheet-apar.firebasestorage.app",
  messagingSenderId: "197433286609",
  appId: "1:197433286609:web:909e645090dc0e87a84af0"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });   // cache offline otomatis

const JENIS = ['Dry Chemical', 'CO2', 'Lithium'], HJ = ['Pengisian', 'Pembelian'];
const ITEMS = ['pin','segel','tuas','selang','nozzle','tabung','gauge','suara','timah','roda'];
const cl = (v, n) => String(v == null ? '' : v).trim().slice(0, n || 200);
const did = (...a) => a.map(x => String(x).replace(/\//g, '-')).join('__');
const isD = x => /^\d{4}-\d{2}-\d{2}$/.test(x);
const stamp = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const C = n => collection(db, n);

function cancelled() { const e = new Error('Dibatalkan'); e.cancelled = true; return e; }


// ---------- baca ----------
const byTs = (a, b) => (a.ts || 0) - (b.ts || 0);
async function read(p) {
  if (p.action === 'aparMaster') {
    const sn = await getDocs(C('apar_master'));
    const rows = sn.docs.map(d => d.data()).sort(byTs).map(x => ({ kode: x.kode, plant: x.plant, jenis: x.jenis, kap: String(x.kap ?? ''), lokasi: x.lokasi, exp: x.exp || '' }));
    return { ok: true, rows };
  }
  if (p.action === 'aparResults') {
    const y = String(p.year || '');
    const sn = await getDocs(y ? query(C('apar_hasil'), where('bulan', '>=', y + '-01'), where('bulan', '<=', y + '-12')) : C('apar_hasil'));
    const rows = sn.docs.map(d => d.data()).sort((a, b) => (a.tgl + a.kode).localeCompare(b.tgl + b.kode))
      .map(x => ({ bulan: x.bulan, tgl: x.tgl, kode: x.kode, plant: x.plant, lokasi: x.lokasi, jenis: x.jenis, kap: String(x.kap ?? ''), items: x.items || {}, berat: x.berat == null ? '' : String(x.berat), petugas: x.petugas, catatan: x.catatan || '' }));
    return { ok: true, rows };
  }
  if (p.action === 'aparHist') {
    const sn = await getDocs(C('apar_histori'));
    const rows = sn.docs.map(d => d.data()).sort((a, b) => String(a.id).localeCompare(String(b.id)))
      .map(x => ({ id: x.id, tgl: x.tgl, plant: x.plant, kode: x.kode, jenis: x.jenis, ket: x.ket || '' }));
    return { ok: true, rows };
  }
  throw new Error('Aksi tidak dikenal: ' + p.action);
}

// ---------- tulis (admin) ----------
function chkMaster(q) {
  const jenis = cl(q.jenis), lokasi = cl(q.lokasi), exp = cl(q.exp), kap = parseFloat(q.kap);
  if (!JENIS.includes(jenis)) throw new Error('Jenis tidak valid');
  if (!(kap > 0)) throw new Error('Kapasitas harus lebih dari 0');
  if (!lokasi) throw new Error('Lokasi wajib diisi');
  if (exp && !isD(exp)) throw new Error('Format tanggal expired tidak valid');
  return { jenis, kap: String(kap), lokasi, exp };
}
async function nextId(col, prefix, field, filter) {
  const sn = await getDocs(filter ? query(C(col), filter) : C(col));
  const re = new RegExp('^' + prefix + '(\\d+)$');
  let max = 0;
  sn.forEach(d => { const m = re.exec(String(d.data()[field] || '')); if (m) max = Math.max(max, +m[1]); });
  return prefix + String(max + 1).padStart(3, '0');
}
async function write(q) {
  const a = q.action;
  if (a === 'aparAdd') {
    const plant = cl(q.plant); if (!plant) throw new Error('Plant wajib diisi');
    const f = chkMaster(q);
    const kode = await nextId('apar_master', 'APAR', 'kode', where('plant', '==', plant));
    await setDoc(doc(db, 'apar_master', did(plant, kode)), { kode, plant, ...f, ts: Date.now() });
    return { ok: true, kode, exp: f.exp };
  }
  if (a === 'aparUpdate') {
    const f = chkMaster(q), r = doc(db, 'apar_master', did(cl(q.plant), cl(q.kode)));
    await updateDoc(r, f);
    return { ok: true, exp: f.exp };
  }
  if (a === 'aparDelete') { await deleteDoc(doc(db, 'apar_master', did(cl(q.plant), cl(q.kode)))); return { ok: true }; }
  if (a === 'aparHistAdd' || a === 'aparHistUpdate') {
    const jenis = cl(q.jenis), tgl = cl(q.tgl), ket = cl(q.ket, 500);
    if (!HJ.includes(jenis)) throw new Error('Jenis transaksi tidak valid');
    if (!tgl) throw new Error('Tanggal transaksi wajib diisi');
    if (!isD(tgl)) throw new Error('Format Tanggal transaksi tidak valid');
    if (a === 'aparHistUpdate') { await updateDoc(doc(db, 'apar_histori', cl(q.id)), { tgl, jenis, ket }); return { ok: true }; }
    const plant = cl(q.plant), kode = cl(q.kode);
    if (!(await getDoc(doc(db, 'apar_master', did(plant, kode)))).exists()) throw new Error('Kode alat tidak ditemukan di plant tersebut');
    const id = await nextId('apar_histori', 'TRX', 'id');
    await setDoc(doc(db, 'apar_histori', id), { id, tgl, plant, kode, jenis, ket, waktu: stamp() });
    return { ok: true, id };
  }
  if (a === 'aparHistDelete') { await deleteDoc(doc(db, 'apar_histori', cl(q.id))); return { ok: true }; }
  throw new Error('Aksi tidak dikenal: ' + a);
}

// ---------- kirim checksheet (petugas, tanpa login) ----------
async function submit(q) {
  const plant = cl(q.plant), kode = cl(q.kode);
  if (!plant) throw new Error('Plant tidak diketahui. Buka ulang lewat QR code alat.');
  const mref = doc(db, 'apar_master', did(plant, kode)), ms = await getDoc(mref);
  if (!ms.exists()) throw new Error('Kode alat tidak ditemukan di master data');
  const a = ms.data();
  const exp = cl(q.exp);
  if (exp && !isD(exp)) throw new Error('Format tanggal expired tidak valid');
  if (!exp && !a.exp) throw new Error('Tanggal expired wajib diisi');
  const tgl = cl(q.tanggal);
  if (!isD(tgl)) throw new Error('Tanggal tidak valid');
  const petugas = cl(q.petugas, 100);
  if (!petugas) throw new Error('Nama petugas wajib diisi');
  const it = q.items || {}, items = {};
  ITEMS.forEach(k => { const v = String(it[k] || ''); if (!['OK', 'NG', 'NA'].includes(v)) throw new Error('Semua item pemeriksaan wajib dipilih'); items[k] = v; });
  let berat = '';
  if (a.jenis === 'CO2') { const b = parseFloat(q.berat); if (!(b > 0)) throw new Error('Berat (kg) wajib diisi untuk APAR CO2'); berat = String(b); }
  const bulan = tgl.slice(0, 7), href = doc(db, 'apar_hasil', did(plant, kode, bulan));
  let updated = false; try { updated = (await getDoc(href)).exists(); } catch (e) {}
  const expUpdated = !!(exp && exp !== String(a.exp || ''));
  const b = writeBatch(db);
  if (expUpdated) b.update(mref, { exp });
  b.set(href, { bulan, tgl, kode, plant, lokasi: a.lokasi, jenis: a.jenis, kap: String(a.kap ?? ''), items, berat, petugas, catatan: cl(q.catatan, 500), waktu: stamp() });
  const pr = b.commit(); pr.catch(() => {});
  const r = await Promise.race([pr.then(() => 'ok'), sleep(8000).then(() => 'queued')]);   // offline: tersimpan di HP, terkirim saat online
  return { ok: true, updated, bulan, expUpdated, queued: r === 'queued' };
}

const guard = (fn, ms, msg) => (...a) => Promise.race([fn(...a), new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
const ERR_A = 'Tidak bisa terhubung ke database Firebase APAR. Pastikan Firestore sudah dibuat (Create database) dan aturan firestore.rules sudah di-Publish di project checksheet-apar, lalu muat ulang halaman.';
window.FBA = { read: guard(read, 15000, ERR_A), write: guard(write, 15000, ERR_A.replace('Tidak bisa terhubung', 'Penyimpanan belum terkonfirmasi. Tidak bisa terhubung')), submit };
window.__fbaOk(window.FBA);
</script>

// ===== firebaseConfig project Hydrant (checksheet-hydrant) =====
const firebaseConfig = {
  apiKey: "AIzaSyAuNTxhA_ldHkKxlVD9uBnElatgwxIDmdo",

const cl = (v, n) => String(v == null ? '' : v).trim().slice(0, n || 200);
const did = (...a) => a.map(x => String(x).replace(/\//g, '-')).join('__');
const isD = x => /^\d{4}-\d{2}-\d{2}$/.test(x);
const stamp = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ITEMS = ['box','nozzle','spray','selang','valve','handle','pilar','coupling','support','pipa'];

if (/^ISI/.test(firebaseConfig.apiKey)) {
  const no = async () => { throw new Error('Firebase Hydrant belum dikonfigurasi di index.html (isi firebaseConfig pada blok script module Hydrant).'); };
  window.FBH = { read: no, write: no, submit: no };
} else {
  const app = initializeApp(firebaseConfig, 'hydrant');
  const db = initializeFirestore(app, { localCache: persistentLocalCache() });
  const C = n => collection(db, n);
  const byTs = (a, b) => (a.ts || 0) - (b.ts || 0);

  async function read(p) {
    if (p.action === 'hydMaster') {
      const sn = await getDocs(C('hyd_master'));
      return { ok: true, rows: sn.docs.map(d => d.data()).sort(byTs).map(x => ({ kode: x.kode, plant: x.plant, lokasi: x.lokasi })) };
    }
    if (p.action === 'hydResults') {

      const rows = sn.docs.map(d => d.data()).sort((a, b) => (a.tgl + a.kode).localeCompare(b.tgl + b.kode))
        .map(x => ({ bulan: x.bulan, tgl: x.tgl, kode: x.kode, plant: x.plant, lokasi: x.lokasi, items: x.items || {}, petugas: x.petugas, catatan: x.catatan || '' }));
      return { ok: true, rows };
    }
    throw new Error('Aksi tidak dikenal: ' + p.action);
  }

  async function write(q) {
    const a = q.action;
    if (a === 'hydAdd') {
      const plant = cl(q.plant), lokasi = cl(q.lokasi);
      if (!plant) throw new Error('Plant wajib diisi');
      if (!lokasi) throw new Error('Lokasi wajib diisi');
      const sn = await getDocs(query(C('hyd_master'), where('plant', '==', plant)));
      let max = 0; sn.forEach(d => { const m = /^(?:HYDRANT|HYD)(\d+)$/.exec(String(d.data().kode || '')); if (m) max = Math.max(max, +m[1]); });
      const kode = 'HYDRANT' + String(max + 1).padStart(3, '0');
      await setDoc(doc(db, 'hyd_master', did(plant, kode)), { kode, plant, lokasi, ts: Date.now() });
      return { ok: true, kode };
    }
    if (a === 'hydUpdate') {
      const lokasi = cl(q.lokasi); if (!lokasi) throw new Error('Lokasi wajib diisi');
      await updateDoc(doc(db, 'hyd_master', did(cl(q.plant), cl(q.kode))), { lokasi });
      return { ok: true };
    }
    if (a === 'hydDelete') { await deleteDoc(doc(db, 'hyd_master', did(cl(q.plant), cl(q.kode)))); return { ok: true }; }
    throw new Error('Aksi tidak dikenal: ' + a);
  }

  async function submit(q) {
    const plant = cl(q.plant), kode = cl(q.kode);
    if (!plant) throw new Error('Plant tidak diketahui. Buka ulang lewat QR code hydrant.');
    const ms = await getDoc(doc(db, 'hyd_master', did(plant, kode)));
    if (!ms.exists()) throw new Error('Kode hydrant tidak ditemukan di master data');
    const a = ms.data();
    const tgl = cl(q.tanggal); if (!isD(tgl)) throw new Error('Tanggal tidak valid');
    const petugas = cl(q.petugas, 100); if (!petugas) throw new Error('Nama petugas wajib diisi');
    const it = q.items || {}, items = {};
    ITEMS.forEach(k => { const v = String(it[k] || ''); if (!['OK', 'NG', 'NA'].includes(v)) throw new Error('Semua item pemeriksaan wajib dipilih'); items[k] = v; });
    const bulan = tgl.slice(0, 7), href = doc(db, 'hyd_hasil', did(plant, kode, bulan));
    let updated = false; try { updated = (await getDoc(href)).exists(); } catch (e) {}
    const pr = setDoc(href, { bulan, tgl, kode, plant, lokasi: a.lokasi, items, petugas, catatan: cl(q.catatan, 500), waktu: stamp() });
    pr.catch(() => {});
    const r = await Promise.race([pr.then(() => 'ok'), sleep(8000).then(() => 'queued')]);   // offline: tersimpan di HP, terkirim saat online
    return { ok: true, updated, bulan, queued: r === 'queued' };
  }
    const guard = (fn, ms, msg) => (...a) => Promise.race([fn(...a), new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
  const ERR_H = 'Tidak bisa terhubung ke database Firebase Hydrant. Pastikan Firestore sudah dibuat (Create database) dan aturan firestore-hydrant.rules sudah di-Publish di project checksheet-hydrant, lalu muat ulang halaman.';
  window.FBH = { read: guard(read, 15000, ERR_H), write: guard(write, 15000, ERR_H.replace('Tidak bisa terhubung', 'Penyimpanan belum terkonfirmasi. Tidak bisa terhubung')), submit };
}
window.__fbhOk(window.FBH);
